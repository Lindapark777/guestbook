# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcode-pyk2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: containerpyk.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B54182AE59564B87A7A03B1663421096 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_3E05DCCD836848029DAD6EB0C115A029 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: containerpyk.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B54182AE59564B87A7A03B1663421096 }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcode-pyk2'
          slot-name: 'Production'
          images: 'containerpyk.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B54182AE59564B87A7A03B1663421096 }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C710C8BB361C4F848CC860DCDA8D85E3 }}